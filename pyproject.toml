[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-beacon"
version = "0.1.0"
description = "Read-only local catalog prototype for ATLAS"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
beacon = "beacon.cli:main"

[tool.setuptools]
packages = ["beacon"]

