[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-beacon"
version = "0.21.5"
description = "Local-first catalog and native desktop observatory for ATLAS"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "PySide6-Essentials==6.11.1",
    "PySide6-Addons==6.11.1",
    "tzdata==2026.3; sys_platform == 'win32'",
    "uvicorn==0.51.0",
    "faster-whisper==1.2.1",
    "Pillow==11.3.0",
    "pillow-heif==1.4.0",
    "rawpy==0.27.0",
    "Send2Trash==1.8.3",
]

[project.scripts]
beacon = "beacon.cli:main"
beacon-desktop = "beacon.desktop:main"
beacon-dashboard = "beacon.desktop:main"
beacon-api = "beacon.app:main"

[tool.setuptools]
packages = ["beacon", "beacon.qml", "beacon.web"]

[tool.setuptools.package-data]
beacon = [
    "qml/*.qml",
    "qml/assets/*.svg",
    "web/*.html",
    "web/*.css",
    "web/*.js",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.7.0",
    "pyinstaller==6.21.0",
]
